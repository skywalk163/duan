site_name: 段言 (Duan) 文档
site_description: 段言 - 中文自然语言编程语言
site_author: Duan Contributors
site_url: https://skywalk163.github.io/duan

repo_name: skywalk163/duan
repo_url: https://github.com/skywalk163/duan
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    primary: indigo
    accent: indigo
  font:
    text: Noto Sans SC
    code: Noto Sans SC
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: zh

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - tables
  - footnotes

nav:
  - 首页: index.md
  - 快速开始: getting-started.md

  - 📖 语言参考:
      - 语法规范: syntax.md
      - 完整规范文档: 段言-完整规范文档.md
      - 类系统设计: class_system_design.md
      - Trait/协议系统: interface-design.md
      - 模式匹配: interface-plan.md
      - 泛型与类型注解: superpowers/specs/2026-07-01-level6-type-annotation-design.md
      - 模块系统: 模块系统与包管理.md
      - FFI 外部函数接口: ffi.md
      - 类型推断系统: HM全局类型推断系统.md
      - 可空类型系统: 可空类型unwrap系统.md

  - 📚 标准库:
      - 标准库总览: stdlib.md
      - API 参考: API_REFERENCE.md
      - API 文档:
          - 概述: api/index.md
      - 内置函数: api/builtins.md
      - 标准模块: api/stdlib.md
      - duanpub 生态: duanpub_integration_design.md
      - duanpub 包文档:
          - 索引与分类: duanpub/README.md
          - 核心包 (P0): duanpub/README.md
          - 全部包列表: duanpub/README.md

  - 🎓 教程:
      - 30 分钟入门: 30分钟入门段言.md
      - 入门教程: tutorials/入门教程.md
      - 进阶教程: tutorials/进阶教程.md
      - 端到端实战: 端到端实战教程.md
      - 示例代码: examples.md

  - 🔧 项目:
      - 架构设计: architecture.md
      - 开发指南: DEVELOPMENT_GUIDE.md
      - 项目结构: 项目结构说明.md
      - 工具链总览: tools.md
      - REPL 设计: REPL_DESIGN.md
      - 引导策略: BOOTSTRAP_STRATEGY.md
      - LLVM 后端: llvm_backend_design.md
      - 性能优化: PERFORMANCE_OPTIMIZATION.md
      - 优化分析: OPTIMIZATION_ANALYSIS.md
      - 项目计划: 三个月工作计划_2026Q3Q4.md
      - 进度报告: PROGRESS_REPORT.md

  - 📝 变更记录:
      - 版本日志: ../CHANGELOG.md
      - 语言扩展历史: LANGUAGE_EXTENSIONS.md
      - 语法变更:
          - v3.1: 统一语法规范_v3.1.md
          - v3.2: 统一语法规范_v3.2.md
          - v3.4: 语法变更_v3.4.md
          - v3.5: 语法变更_v3.5.md
      - 最终总结: FINAL_SUMMARY.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/skywalk163/duan