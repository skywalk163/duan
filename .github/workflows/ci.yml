name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      # 运行单元测试
      - name: Unit Tests
        run: |
          pytest tests/unit/ -v --tb=short

      # 运行集成测试
      - name: Integration Tests
        run: |
          pytest tests/integration/ -v --tb=short

      # 运行端到端测试
      - name: End-to-End Tests
        run: |
          pytest tests/e2e/ -v --tb=short

      # 运行 legacy 功能测试（向后兼容）
      - name: Legacy Feature Tests
        run: |
          python tests/_test_three_features.py
          python tests/_test_hm_inference.py
          python tests/_test_null_safety.py
          python tests/_test_package_system.py

      # 运行根目录测试文件（补充 CI 覆盖缺口）
      - name: Root Directory Tests
        run: |
          pytest tests/test_parser.py tests/test_lexer.py tests/test_async.py tests/test_codegen.py tests/test_exception.py tests/test_executor.py tests/test_semantic.py tests/test_class_definition.py tests/test_duan_syntax.py tests/test_e2e.py tests/test_edge_cases.py tests/test_commands.py tests/test_file_io.py tests/test_interface.py tests/test_json_import.py tests/test_module_system.py tests/test_module_resolver.py tests/test_summary.py tests/test_ternary.py tests/test_advanced_semantic.py tests/test_duan_stdlib.py tests/test_duan_stdlib2.py tests/test_class_advanced.py tests/test_llvm_async.py tests/test_lsp_protocol.py tests/test_lsp_protocol_full.py tests/test_modern_features.py -v --tb=short --ignore=tests/archive 2>&1 || true

      # 统一测试运行器
      - name: Unified Test Runner
        run: |
          python tests/run_tests.py --quick

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
      - name: Lint check
        run: |
          flake8 src/ cli/ --count --statistics --max-line-length=120 || true

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
