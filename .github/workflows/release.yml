name: 发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 6.0.0）'
        required: true
        type: string

jobs:
  build-and-publish:
    name: 构建并发布到 PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: 构建分发包
        run: python -m build

      - name: 验证分发包
        run: python -m twine check dist/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 发布到 PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

  github-release:
    name: 创建 GitHub Release
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 生成发布说明
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IS_PRERELEASE=false
          if echo "$VERSION" | grep -qE "-(rc|alpha|beta|dev)"; then
            IS_PRERELEASE=true
          fi
          echo "prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          if [ "$IS_PRERELEASE" = "true" ]; then
            cat > release_body.md << RELEOF
          ## 段言（Duan）v$VERSION 预览版发布！

          这是段言 v6.1.0 的社区预览版本，欢迎测试和反馈。

          ### 安装

          \`\`\`bash
          pip install duan==$VERSION
          \`\`\`

          ### 主要新特性

          - **100% 中文错误信息** — 全量替换 20+ 种英文异常为中文
          - **标准库 4 大增强** — 网络请求、日期时间、文件系统、中文 NLP
          - **LLVM 编译体验优化** — 自动下载依赖、增量编译加速
          - **AI Copilot 升级** — 离线模型、Java/C→段言转换
          - **C FFI 绑定简化** — 一键加载 C 库
          - **一键安装包** — Windows/macOS/Linux 安装包方案

          ### 完整更新日志

          请参阅 [CHANGELOG.md](CHANGELOG.md) 和 [docs/release_notes_v6.1.0.md](docs/release_notes_v6.1.0.md) 获取完整变更列表。

          ### 反馈

          请通过 [GitHub Issues](https://github.com/skywalk163/duan/issues) 提交 bug 报告和功能建议。
          RELEOF
          else
            cat > release_body.md << RELEOF
          ## 段言（Duan）v6.1.0 正式发布！

          段言 v6.1.0 是 v6.0 大版本后的首个功能更新，聚焦于**中文编程体验的全面升级**——从 100% 中文错误信息到标准库增强，从 LLVM 编译优化到 AI Copilot 升级，共 20+ 项新特性。

          ### 亮点速览

          - 🌐 **100% 中文错误信息** — 全量替换 20+ 种英文异常为中文，附中文修改指引
          - 📚 **标准库 4 大增强** — 网络请求、日期时间、文件系统、中文 NLP 全新模块
          - 🚀 **LLVM 编译体验优化** — 自动下载依赖、EXE 体积优化、增量编译加速
          - 🤖 **AI Copilot 升级** — 离线轻量模型、Java/C→段言转换、数据集 v12
          - 🔌 **C FFI 绑定简化** — 一键加载 C 库，预设 libc/libm 等常用库绑定
          - 📦 **一键安装包** — Windows/macOS/Linux 安装包方案
          - 💬 **社区反馈收集** — \`duan feedback\` 命令，一键反馈到 GitHub

          ### 安装

          \`\`\`bash
          pip install duan==$VERSION
          \`\`\`

          ### 完整更新日志

          请参阅 [CHANGELOG.md](CHANGELOG.md) 和 [docs/release_notes_v6.1.0.md](docs/release_notes_v6.1.0.md) 获取完整变更列表。
          RELEOF
          fi

          echo "body<<BODYEOF" >> $GITHUB_OUTPUT
          cat release_body.md >> $GITHUB_OUTPUT
          echo "BODYEOF" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 段言 ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: dist/*
          draft: false
          prerelease: ${{ steps.release_notes.outputs.prerelease }}
          generate_release_notes: false